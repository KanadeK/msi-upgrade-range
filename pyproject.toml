[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "msi-upgrade-range"
version = "0.1.0"
description = "Explain MSI major-upgrade range coverage."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "KanadeK"}]
dependencies = []

[project.scripts]
msi-upgrade-range = "msi_upgrade_range.cli:main"

[project.urls]
Homepage = "https://github.com/KanadeK/msi-upgrade-range"
Issues = "https://github.com/KanadeK/msi-upgrade-range/issues"

[tool.setuptools.packages.find]
include = ["msi_upgrade_range*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
